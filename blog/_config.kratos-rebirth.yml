# Kratos-Rebirth 2.1.5 主题配置
site_logo: /images/avatar.jpg
avatarUri: /images/av2.jpg
hoster: <a href="https://github.io" target="_blank">Github Pages</a>

snow: true
click_animate_js: candy
enable_dark: true
highlight_theme: night
check_update: false

customStyles:
  images:
    banner: /images/bas4.jpg
    background: /images/background1.jpg

topMenu:
  - label: 首页
    icon: home
    url: /
  - label: 档案馆
    icon: file
    url: /archives/
  - label: 链接
    icon: link
    submenu:
      - label: 博客
        url: https://github.com/

posts:
  show_cc: true
  donate: false
  share: true
  comments:
    provider: ''
    enableBGImage: false
  wordCount:
    enable: true
    threshold: 1500

aplayer:
  enabled: true
  playlist:
  meting:
    server: netease
    type: playlist
    id: 3204190542
  order: random

sidebar: left
widgets:
  - about
  - splitter
  - toc
  - category
  - tagcloud
  - posts
mobile_toc:
  hide: false
  hide_id: false
fancybox: true

search:
  enable: true
  path: search.json
  field: post
  content: true

jsconfig:
  main:
    cover:
      randomAmount: 20
      baseUrl:
      filenameTemplate: thumb_{no}.webp
    createTime: '2023/09/21 20:38:42'
    donateBtn: 支持我~
    scanNotice: 扫一扫，好不好？
    qr_alipay: /images/alipayqr.webp
    qr_wechat: /images/wechatpayqr.webp
    siteLeaveEvent: false
    leaveTitle: '{{{(>_<)}}}哦哟，崩溃啦~'
    returnTitle: (*´∇｀*)欸，又好啦~
    copyrightNotice: 该内容采用 CC BY-NC-SA 4.0 许可协议，著作权归作者所有。商业转载请联系作者获得授权，非商业转载请注明出处。
    expire_day: 30
    topNavScrollToggle: true

misc:
  showWordCountEstimateWavy: true
